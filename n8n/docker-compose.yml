version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: netverify-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Africa/Tunis
      - TZ=Africa/Tunis
      # Uncomment if the UI stays stuck on the sign-in screen:
      # - N8N_SECURE_COOKIE=false
    extra_hosts:
      # The workflow reaches the backend through host.docker.internal: from
      # inside this container, 127.0.0.1 would designate n8n itself. Native on
      # Docker Desktop; required for a Linux daemon.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
