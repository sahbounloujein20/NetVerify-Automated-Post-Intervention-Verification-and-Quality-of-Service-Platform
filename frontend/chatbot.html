<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif; }

  /* Same design tokens as v1 (see netverify/theme.py). */
  :root {
      --plane: #0a0e14;
      --surface: #10161c;
      --surface-2: #141b26;
      --line: rgba(255,255,255,.08);
      --line-strong: rgba(255,255,255,.14);
      --ink: #eef2f6;
      --ink-2: #b8c0cc;
      --ink-3: #8b9aad;
      --brand: #0072bc;
      --brand-400: #1478c8;
      --good: #1e9e6b;
      --critical: #f47b86;
  }

  /* The document itself stays empty and transparent: everything is fixed
     positioned, so the host iframe must never show a scrollbar. */
  html, body { background: transparent; overflow: hidden; height: 100%; }

  /* ── Launcher ────────────────────────────────────────────────────────── */
  #launcher {
      position: fixed; bottom: 20px; right: 20px;
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--brand-400));
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 999;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 10px 28px -8px rgba(0,114,188,.9), inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .16s ease, box-shadow .16s ease;
  }
  #launcher:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -10px rgba(0,114,188,1); }
  #launcher svg { width: 22px; height: 22px; stroke: #fff; }
  #launcher .dot {
      position: absolute; top: -3px; right: -3px; width: 11px; height: 11px;
      border-radius: 50%; background: var(--good); border: 2px solid var(--plane);
  }

  /* ── Window ──────────────────────────────────────────────────────────── */
  #panel {
      position: fixed; bottom: 88px; right: 22px;
      width: 372px; height: 528px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      display: none; flex-direction: column; overflow: hidden;
      box-shadow: 0 30px 70px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05);
      z-index: 1000;
  }
  #panel.open { display: flex; }

  #head {
      display: flex; align-items: center; gap: 11px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(20,120,200,.12), rgba(20,120,200,0));
  }
  #head .mark {
      width: 32px; height: 32px; border-radius: 10px; flex: 0 0 32px;
      background: linear-gradient(140deg, var(--brand-400), var(--brand));
      display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px;
  }
  #head .title { color: var(--ink); font-weight: 700; font-size: 13.5px; line-height: 1.2; }
  #head .sub { color: var(--ink-3); font-size: 11px; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
  #head .sub i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block; }
  #head .close {
      margin-left: auto; color: var(--ink-3); cursor: pointer; font-size: 15px;
      width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  }
  #head .close:hover { color: var(--ink); background: rgba(255,255,255,.06); }

  #log {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      background: var(--plane);
  }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 12px; font-size: 12.5px;
         line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { background: var(--surface-2); color: var(--ink-2); align-self: flex-start;
             border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.user { background: linear-gradient(140deg, var(--brand-400), var(--brand)); color: #fff;
              align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.error { background: rgba(220,53,69,.1); color: var(--critical);
               border: 1px solid rgba(220,53,69,.32); align-self: flex-start; }
  .msg.typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px; align-items: center; }
  .msg.typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3);
      animation: blink 1.2s infinite ease-in-out;
  }
  .msg.typing span:nth-child(2) { animation-delay: .18s; }
  .msg.typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }

  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; background: var(--plane); }
  #chips button {
      border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-2);
      font-size: 11.5px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  #chips button:hover { color: var(--ink); border-color: rgba(20,120,200,.45); }

  #bar { display: flex; gap: 8px; padding: 11px; background: var(--surface); border-top: 1px solid var(--line); }
  #field {
      flex: 1; background: var(--surface-2); border: 1px solid var(--line-strong);
      border-radius: 10px; padding: 10px 12px; color: var(--ink); font-size: 12.5px; outline: none;
  }
  #field:focus { border-color: var(--brand-400); box-shadow: 0 0 0 3px rgba(20,120,200,.2); }
  #send {
      width: 40px; height: 40px; border-radius: 10px; border: none; cursor: pointer;
      background: linear-gradient(140deg, var(--brand-400), var(--brand)); color: #fff;
      display: grid; place-items: center;
  }
  #send svg { width: 17px; height: 17px; stroke: #fff; }
  #send:hover { filter: brightness(1.1); }
  #send:disabled { opacity: .45; cursor: not-allowed; }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: #253040; border-radius: 3px; }
</style>
</head>
<body>

<div id="launcher" onclick="toggle()" title="Assistant NetVerify">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span class="dot"></span>
</div>

<div id="panel" role="dialog" aria-label="Assistant NetVerify">
  <div id="head">
    <div class="mark">NV</div>
    <div>
      <div class="title">Assistant NetVerify</div>
      <div class="sub"><i></i>Connected to production data</div>
    </div>
    <div class="close" onclick="toggle()" title="Close">&#10005;</div>
  </div>
  <div id="log"></div>
  <div id="chips">
    <button onclick="ask('Give me the overall KPIs')">Overall KPIs</button>
    <button onclick="ask('Which zones concentrate the most anomalies?')">Critical zones</button>
    <button onclick="ask('Technician performance')">Technicians</button>
  </div>
  <div id="bar">
    <input id="field" type="text" autocomplete="off"
           placeholder="E.g. GPON anomalies, TECH-012, resolution rate…"
           onkeydown="if(event.key==='Enter') send()">
    <button id="send" onclick="send()" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const API_BASE = "__API_URL__";
  const API_URL = API_BASE + "/chatbot/query";
  // Streamlit session token, copied in when the template is built: the iframe
  // runs in the browser and has no access to the server-side state.
  const TOKEN = "__TOKEN__";
  const logEl = document.getElementById("log");
  const fieldEl = document.getElementById("field");
  const sendBtn = document.getElementById("send");
  let opened = false;

  // Streamlit renders this file in its own iframe. We grab that iframe to
  // reposition it: the widget then floats above the whole application instead
  // of being embedded wherever components.html() was called.
  function syncFrame() {
      const frame = window.frameElement;
      if (!frame) return;
      Object.assign(frame.style, {
          position: "fixed", bottom: "0", right: "0", border: "none",
          zIndex: "999999", background: "transparent", colorScheme: "normal",
          width: opened ? "420px" : "96px",
          height: opened ? "640px" : "96px",
      });
  }

  function toggle() {
      opened = !opened;
      document.getElementById("panel").classList.toggle("open", opened);
      syncFrame();
      if (opened) {
          if (logEl.children.length === 0) {
              add("bot", "Hello, I am the NetVerify assistant. Ask me about work orders, a zone, a technician or this month's indicators.");
          }
          fieldEl.focus();
      }
  }

  function add(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
      return el;
  }

  function typing() {
      const el = document.createElement("div");
      el.className = "msg typing";
      el.innerHTML = "<span></span><span></span><span></span>";
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
      return el;
  }

  function ask(question) { fieldEl.value = question; send(); }

  async function send() {
      const text = fieldEl.value.trim();
      if (!text) return;
      add("user", text);
      fieldEl.value = "";
      sendBtn.disabled = true;
      const pending = typing();

      try {
          const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + TOKEN
              },
              body: JSON.stringify({ message: text })
          });
          const data = await response.json();
          pending.remove();
          // 401 and 429 deserve an actionable sentence: "HTTP 401" does not tell
          // the technician that reloading the page is all it takes.
          if (response.status === 401) {
              throw new Error("Session expired. Reload the page to sign in again.");
          }
          if (response.status === 429) {
              throw new Error("Too many questions in a row. Wait a minute.");
          }
          if (!response.ok) throw new Error(data.detail || ("HTTP " + response.status));
          add("bot", data.response || "I have no answer to give for that question.");
      } catch (err) {
          pending.remove();
          add("error", (err.message || "Connection failed") +
              " — check that the FastAPI backend is answering on " + API_BASE + ".");
      } finally {
          sendBtn.disabled = false;
          fieldEl.focus();
      }
  }

  syncFrame();
</script>

</body>
</html>
